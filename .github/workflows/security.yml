name: Security Pipeline

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  test-and-sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm test
      - name: Software composition analysis
        run: npm audit --audit-level=high
      - name: Semgrep SAST
        run: |
          python -m pip install --upgrade pip
          pip install semgrep
          semgrep scan --config .semgrep.yml --error

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks secrets scan
        uses: gitleaks/gitleaks-action@v3.0.0

  container-and-dast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t appsec-demo:${{ github.sha }} .
      - name: Trivy container scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: appsec-demo:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
      - name: Run application
        run: |
          docker run -d --name appsec-demo -p 3000:3000 appsec-demo:${{ github.sha }}
          for i in {1..20}; do
            curl --fail http://127.0.0.1:3000/health && exit 0
            sleep 2
          done
          exit 1
      - name: OWASP ZAP baseline
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://127.0.0.1:3000
          rules_file_name: .zap/rules.tsv
          fail_action: true
          allow_issue_writing: false
